<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Para Yiyis <3</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=Cormorant+Garamond:ital,wght@0,300;1,300&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --lily-white: #f0e8d8;
    --lily-cream: #e8d5b0;
    --lily-gold: #d4a853;
    --lily-orange: #e8824a;
    --glow-white: rgba(240,232,216,0.6);
    --glow-gold: rgba(212,168,83,0.5);
    --stem-green: #4a7c59;
    --leaf-green: #3d6b4a;
    --bg: #050505;
  }

  body {
    background: var(--bg);
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow-x: hidden;
    overflow-y: auto;
    font-family: 'Cormorant Garamond', serif;
    position: relative;
    padding: 20px 10px;
  }

  /* Particles */
  .particles {
    position: fixed;
    inset: 0;
    pointer-events: none;
    z-index: 0;
  }
  .particle {
    position: absolute;
    width: 3px;
    height: 3px;
    border-radius: 50%;
    background: var(--lily-gold);
    opacity: 0;
    animation: float-particle linear infinite;
  }

  @keyframes float-particle {
    0% { transform: translateY(110vh) scale(0); opacity: 0; }
    10% { opacity: 0.7; }
    90% { opacity: 0.4; }
    100% { transform: translateY(-10vh) scale(1.5); opacity: 0; }
  }

  /* Scene */
  .scene {
    position: relative;
    z-index: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 0;
  }

  /* Message */
  .message {
    text-align: center;
    margin-bottom: 30px;
    position: relative;
  }
  .message h1 {
    font-family: 'Playfair Display', serif;
    font-size: clamp(1.6rem, 7vw, 4rem);
    font-weight: 400;
    font-style: italic;
    color: var(--lily-cream);
    text-shadow:
      0 0 20px rgba(240,232,216,0.8),
      0 0 60px rgba(212,168,83,0.5),
      0 0 100px rgba(212,168,83,0.3);
    animation: pulse-text 3s ease-in-out infinite;
    letter-spacing: 0.05em;
  }
  .message .sub {
    font-size: 1.1rem;
    color: rgba(212,168,83,0.7);
    font-style: italic;
    margin-top: 6px;
    letter-spacing: 0.15em;
    animation: fadeInSub 2s ease 0.5s both;
  }

  @keyframes pulse-text {
    0%, 100% { text-shadow: 0 0 20px rgba(240,232,216,0.8), 0 0 60px rgba(212,168,83,0.5), 0 0 100px rgba(212,168,83,0.3); }
    50% { text-shadow: 0 0 30px rgba(240,232,216,1), 0 0 80px rgba(212,168,83,0.8), 0 0 140px rgba(212,168,83,0.5), 0 0 200px rgba(212,168,83,0.2); }
  }
  @keyframes fadeInSub {
    from { opacity: 0; transform: translateY(10px); }
    to { opacity: 1; transform: none; }
  }

  /* Bouquet Container */
  .bouquet {
    position: relative;
    width: min(380px, 92vw);
    height: min(480px, 65vh);
    filter: drop-shadow(0 0 30px rgba(212,168,83,0.3));
  }

  /* SVG lilies */
  svg.bouquet-svg {
    width: 100%;
    height: 100%;
    overflow: visible;
  }

  /* Glow filter */
  .glow-layer {
    position: absolute;
    inset: -40px;
    background: radial-gradient(ellipse at 50% 60%, rgba(212,168,83,0.15) 0%, transparent 70%);
    animation: glow-pulse 3s ease-in-out infinite;
    pointer-events: none;
    border-radius: 50%;
  }

  @keyframes glow-pulse {
    0%, 100% { opacity: 0.6; transform: scale(1); }
    50% { opacity: 1; transform: scale(1.05); }
  }

  /* Petal animations */
  .lily-group { animation: sway 4s ease-in-out infinite; transform-origin: bottom center; }
  .lily-group:nth-child(1) { animation-delay: 0s; animation-duration: 3.8s; }
  .lily-group:nth-child(2) { animation-delay: 0.4s; animation-duration: 4.2s; }
  .lily-group:nth-child(3) { animation-delay: 0.8s; animation-duration: 3.6s; }
  .lily-group:nth-child(4) { animation-delay: 0.2s; animation-duration: 4.5s; }
  .lily-group:nth-child(5) { animation-delay: 1s; animation-duration: 3.9s; }

  @keyframes sway {
    0%, 100% { transform: rotate(-1.5deg); }
    50% { transform: rotate(1.5deg); }
  }

  /* Petal glow animation */
  @keyframes petal-shimmer {
    0%, 100% { opacity: 0.15; }
    50% { opacity: 0.35; }
  }

  /* Ribbon */
  .ribbon-wrap {
    position: absolute;
    bottom: 0;
    left: 50%;
    transform: translateX(-50%);
  }

  /* Music Panel */
  .music-panel {
    position: fixed;
    left: -280px;
    top: 50%;
    transform: translateY(-50%);
    width: 280px;
    background: rgba(8,6,4,0.95);
    border: 1px solid rgba(212,168,83,0.3);
    border-left: none;
    border-radius: 0 16px 16px 0;
    padding: 24px 20px;
    transition: left 0.5s cubic-bezier(0.4,0,0.2,1);
    z-index: 100;
    backdrop-filter: blur(20px);
    box-shadow: 4px 0 40px rgba(0,0,0,0.8), inset -1px 0 0 rgba(212,168,83,0.1);
  }
  .music-panel.open { left: 0; }

  .music-tab {
    position: absolute;
    right: -44px;
    top: 50%;
    transform: translateY(-50%);
    width: 44px;
    height: 80px;
    background: rgba(8,6,4,0.95);
    border: 1px solid rgba(212,168,83,0.3);
    border-left: none;
    border-radius: 0 12px 12px 0;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    writing-mode: vertical-rl;
    font-size: 0.65rem;
    letter-spacing: 0.12em;
    color: rgba(212,168,83,0.8);
    font-family: 'Cormorant Garamond', serif;
    transition: background 0.2s, color 0.2s;
    user-select: none;
    box-shadow: 4px 0 20px rgba(0,0,0,0.5);
  }
  .music-tab:hover { color: var(--lily-gold); background: rgba(20,15,8,0.98); }
  .music-tab-icon { font-size: 1rem; margin-bottom: 6px; writing-mode: horizontal-tb; }

  .music-title {
    font-family: 'Playfair Display', serif;
    font-size: 0.8rem;
    color: rgba(212,168,83,0.5);
    letter-spacing: 0.2em;
    text-transform: uppercase;
    margin-bottom: 16px;
  }

  .song-info {
    display: flex;
    align-items: center;
    gap: 14px;
    margin-bottom: 20px;
  }
  .song-art {
    width: 56px;
    height: 56px;
    border-radius: 8px;
    background: linear-gradient(135deg, #1a1208, #2d1f0a);
    border: 1px solid rgba(212,168,83,0.3);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 1.6rem;
    flex-shrink: 0;
    animation: spin-art 8s linear infinite paused;
  }
  .song-art.playing { animation-play-state: running; }
  @keyframes spin-art {
    from { transform: rotate(0deg); }
    to { transform: rotate(360deg); }
  }
  .song-name {
    font-family: 'Playfair Display', serif;
    font-size: 1rem;
    color: var(--lily-cream);
    font-style: italic;
  }
  .song-artist {
    font-size: 0.8rem;
    color: rgba(212,168,83,0.6);
    margin-top: 2px;
    letter-spacing: 0.05em;
  }

  .player-controls {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 16px;
    margin-bottom: 16px;
  }
  .ctrl-btn {
    background: none;
    border: none;
    cursor: pointer;
    color: rgba(212,168,83,0.6);
    font-size: 1.2rem;
    transition: color 0.2s, transform 0.1s;
    padding: 6px;
  }
  .ctrl-btn:hover { color: var(--lily-gold); transform: scale(1.1); }
  .play-btn {
    width: 46px;
    height: 46px;
    border-radius: 50%;
    background: linear-gradient(135deg, var(--lily-gold), var(--lily-orange));
    border: none;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 1rem;
    color: #050505;
    transition: transform 0.15s, box-shadow 0.2s;
    box-shadow: 0 0 20px rgba(212,168,83,0.4);
  }
  .play-btn:hover { transform: scale(1.08); box-shadow: 0 0 30px rgba(212,168,83,0.7); }

  .progress-bar {
    width: 100%;
    height: 3px;
    background: rgba(212,168,83,0.15);
    border-radius: 2px;
    cursor: pointer;
    position: relative;
    margin-bottom: 8px;
  }
  .progress-fill {
    height: 100%;
    background: linear-gradient(90deg, var(--lily-gold), var(--lily-orange));
    border-radius: 2px;
    width: 0%;
    transition: width 0.5s linear;
    box-shadow: 0 0 8px rgba(212,168,83,0.5);
  }

  .time-row {
    display: flex;
    justify-content: space-between;
    font-size: 0.7rem;
    color: rgba(212,168,83,0.4);
    margin-bottom: 14px;
  }

  .volume-row {
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .vol-icon { color: rgba(212,168,83,0.5); font-size: 0.9rem; }
  input[type=range] {
    -webkit-appearance: none;
    flex: 1;
    height: 3px;
    background: rgba(212,168,83,0.2);
    border-radius: 2px;
    cursor: pointer;
    outline: none;
  }
  input[type=range]::-webkit-slider-thumb {
    -webkit-appearance: none;
    width: 12px;
    height: 12px;
    border-radius: 50%;
    background: var(--lily-gold);
    box-shadow: 0 0 6px rgba(212,168,83,0.6);
  }

  .yt-note {
    margin-top: 14px;
    padding: 10px 12px;
    background: rgba(212,168,83,0.06);
    border: 1px solid rgba(212,168,83,0.15);
    border-radius: 8px;
    font-size: 0.72rem;
    color: rgba(212,168,83,0.5);
    line-height: 1.5;
    font-style: italic;
  }
  .yt-link {
    display: block;
    margin-top: 8px;
    color: rgba(240,232,216,0.7);
    text-decoration: none;
    font-size: 0.75rem;
    letter-spacing: 0.04em;
    transition: color 0.2s;
  }
  .yt-link:hover { color: var(--lily-gold); }
</style>
</head>
<body>

<!-- Particles -->
<div class="particles" id="particles"></div>

<!-- Music Panel -->
<div class="music-panel" id="musicPanel">
  <div class="music-tab" onclick="togglePanel()">
    <span class="music-tab-icon">🎵</span>
    música
  </div>
  <div class="music-title">♪ ahora suena</div>
  <div class="song-info">
    <div class="song-art" id="songArt">🌸</div>
    <div>
      <div class="song-name">Seoul City</div>
      <div class="song-artist">Jennie</div>
    </div>
  </div>
  <div class="player-controls">
    <button class="ctrl-btn" onclick="restart()">⏮</button>
    <button class="play-btn" id="playBtn" onclick="togglePlay()">▶</button>
    <button class="ctrl-btn" style="opacity:0.3" title="Loop">🔁</button>
  </div>
  <div class="progress-bar" onclick="seekAudio(event)">
    <div class="progress-fill" id="progressFill"></div>
  </div>
  <div class="time-row">
    <span id="currentTime">0:00</span>
    <span id="totalTime">0:00</span>
  </div>
  <div class="volume-row">
    <span class="vol-icon">🔈</span>
    <input type="range" min="0" max="1" step="0.01" value="0.7" id="volSlider" oninput="setVolume(this.value)">
    <span class="vol-icon">🔊</span>
  </div>
  <div class="yt-note">
    La música viene de YouTube
  .necesitas conexión a internet para escucharla.
  </div>
</div>

<!-- Main Scene -->
<div class="scene">
  <div class="message">
    <h1>Hola Yiyis, te quiero </h1>
    <p class="sub">— para ti, con todo mi cansancio—</p>
  </div>

  <div class="bouquet">
    <div class="glow-layer"></div>
    <svg class="bouquet-svg" viewBox="0 0 380 480" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <!-- Glow filters -->
        <filter id="glow-soft" x="-50%" y="-50%" width="200%" height="200%">
          <feGaussianBlur stdDeviation="6" result="blur"/>
          <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
        </filter>
        <filter id="glow-strong" x="-80%" y="-80%" width="260%" height="260%">
          <feGaussianBlur stdDeviation="10" result="blur"/>
          <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
        </filter>
        <filter id="stem-glow" x="-30%" y="-5%" width="160%" height="110%">
          <feGaussianBlur stdDeviation="3" result="blur"/>
          <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
        </filter>

        <!-- Gradients -->
        <radialGradient id="petal-main" cx="50%" cy="80%" r="60%">
          <stop offset="0%" stop-color="#f5ece0"/>
          <stop offset="60%" stop-color="#e8d5b0"/>
          <stop offset="100%" stop-color="#d4a853" stop-opacity="0.6"/>
        </radialGradient>
        <radialGradient id="petal-orange" cx="50%" cy="80%" r="60%">
          <stop offset="0%" stop-color="#f5e0c8"/>
          <stop offset="55%" stop-color="#e8a068"/>
          <stop offset="100%" stop-color="#c06030" stop-opacity="0.7"/>
        </radialGradient>
        <radialGradient id="petal-warm" cx="50%" cy="80%" r="60%">
          <stop offset="0%" stop-color="#f8eed8"/>
          <stop offset="60%" stop-color="#e0c090"/>
          <stop offset="100%" stop-color="#b8862a" stop-opacity="0.5"/>
        </radialGradient>
        <linearGradient id="stem-grad" x1="0%" y1="0%" x2="100%" y2="0%">
          <stop offset="0%" stop-color="#3a6045"/>
          <stop offset="50%" stop-color="#5a9068"/>
          <stop offset="100%" stop-color="#3a6045"/>
        </linearGradient>
        <linearGradient id="ribbon-grad" x1="0%" y1="0%" x2="100%" y2="100%">
          <stop offset="0%" stop-color="#d4a853"/>
          <stop offset="50%" stop-color="#f0cc70"/>
          <stop offset="100%" stop-color="#a07830"/>
        </linearGradient>
        <radialGradient id="stamen-glow" cx="50%" cy="50%" r="50%">
          <stop offset="0%" stop-color="#ffe080"/>
          <stop offset="100%" stop-color="#d4a853" stop-opacity="0"/>
        </radialGradient>
      </defs>

      <!-- ====== STEMS ====== -->
      <g filter="url(#stem-glow)">
        <!-- Stem 1 center -->
        <path d="M190 470 Q185 380 188 300" stroke="url(#stem-grad)" stroke-width="5" fill="none" stroke-linecap="round"/>
        <!-- Stem 2 left -->
        <path d="M190 470 Q165 400 148 320" stroke="url(#stem-grad)" stroke-width="4.5" fill="none" stroke-linecap="round"/>
        <!-- Stem 3 right -->
        <path d="M190 470 Q215 400 230 320" stroke="url(#stem-grad)" stroke-width="4.5" fill="none" stroke-linecap="round"/>
        <!-- Stem 4 far left -->
        <path d="M190 470 Q145 420 118 350" stroke="url(#stem-grad)" stroke-width="4" fill="none" stroke-linecap="round"/>
        <!-- Stem 5 far right -->
        <path d="M190 470 Q235 420 262 350" stroke="url(#stem-grad)" stroke-width="4" fill="none" stroke-linecap="round"/>
      </g>

      <!-- Leaves -->
      <g opacity="0.9">
        <ellipse cx="168" cy="380" rx="22" ry="9" fill="#4a7c59" transform="rotate(-30 168 380)" filter="url(#glow-soft)"/>
        <ellipse cx="212" cy="375" rx="20" ry="8" fill="#4a7c59" transform="rotate(28 212 375)" filter="url(#glow-soft)"/>
        <ellipse cx="150" cy="408" rx="18" ry="7" fill="#3d6b4a" transform="rotate(-45 150 408)" filter="url(#glow-soft)"/>
        <ellipse cx="232" cy="405" rx="17" ry="7" fill="#3d6b4a" transform="rotate(42 232 405)" filter="url(#glow-soft)"/>
        <ellipse cx="178" cy="350" rx="16" ry="6" fill="#4a7c59" transform="rotate(-20 178 350)" filter="url(#glow-soft)"/>
        <ellipse cx="205" cy="345" rx="15" ry="6" fill="#4a7c59" transform="rotate(22 205 345)" filter="url(#glow-soft)"/>
      </g>

      <!-- ====== LILY 1 — CENTER, TALL (cream/gold) ====== -->
      <g class="lily-group" style="transform-origin: 188px 300px">
        <!-- 6 petals radially -->
        <g transform="translate(188,285)" filter="url(#glow-soft)">
          <ellipse cx="0" cy="-42" rx="13" ry="45" fill="url(#petal-main)" transform="rotate(0)" opacity="0.95"/>
          <ellipse cx="0" cy="-42" rx="13" ry="45" fill="url(#petal-main)" transform="rotate(60)" opacity="0.95"/>
          <ellipse cx="0" cy="-42" rx="13" ry="45" fill="url(#petal-main)" transform="rotate(120)" opacity="0.95"/>
          <ellipse cx="0" cy="-42" rx="13" ry="45" fill="url(#petal-main)" transform="rotate(180)" opacity="0.85"/>
          <ellipse cx="0" cy="-42" rx="13" ry="45" fill="url(#petal-main)" transform="rotate(240)" opacity="0.85"/>
          <ellipse cx="0" cy="-42" rx="13" ry="45" fill="url(#petal-main)" transform="rotate(300)" opacity="0.85"/>
          <!-- Petal spots -->
          <circle cx="0" cy="-30" r="2.5" fill="#c8883a" opacity="0.5" transform="rotate(0)"/>
          <circle cx="0" cy="-30" r="2.5" fill="#c8883a" opacity="0.5" transform="rotate(60)"/>
          <circle cx="0" cy="-30" r="2.5" fill="#c8883a" opacity="0.5" transform="rotate(120)"/>
          <!-- Stamen glow -->
          <circle cx="0" cy="0" r="18" fill="url(#stamen-glow)" opacity="0.6" style="animation: petal-shimmer 3s ease-in-out infinite;"/>
          <circle cx="0" cy="0" r="7" fill="#ffe080" opacity="0.9" filter="url(#glow-strong)"/>
          <!-- Stamens -->
          <line x1="0" y1="0" x2="0" y2="-16" stroke="#c8883a" stroke-width="1.5"/>
          <line x1="0" y1="0" x2="13" y2="-9" stroke="#c8883a" stroke-width="1.5"/>
          <line x1="0" y1="0" x2="13" y2="9" stroke="#c8883a" stroke-width="1.5"/>
          <line x1="0" y1="0" x2="0" y2="16" stroke="#c8883a" stroke-width="1.5"/>
          <line x1="0" y1="0" x2="-13" y2="9" stroke="#c8883a" stroke-width="1.5"/>
          <line x1="0" y1="0" x2="-13" y2="-9" stroke="#c8883a" stroke-width="1.5"/>
          <circle cx="0" cy="-16" r="3" fill="#d4a853" filter="url(#glow-soft)"/>
          <circle cx="13" cy="-9" r="3" fill="#d4a853" filter="url(#glow-soft)"/>
          <circle cx="13" cy="9" r="3" fill="#d4a853" filter="url(#glow-soft)"/>
          <circle cx="0" cy="16" r="3" fill="#d4a853" filter="url(#glow-soft)"/>
          <circle cx="-13" cy="9" r="3" fill="#d4a853" filter="url(#glow-soft)"/>
          <circle cx="-13" cy="-9" r="3" fill="#d4a853" filter="url(#glow-soft)"/>
        </g>
      </g>

      <!-- ====== LILY 2 — LEFT (orange/warm) ====== -->
      <g class="lily-group" style="transform-origin: 148px 310px">
        <g transform="translate(148,300) rotate(-15)" filter="url(#glow-soft)">
          <ellipse cx="0" cy="-38" rx="12" ry="40" fill="url(#petal-orange)" transform="rotate(0)" opacity="0.95"/>
          <ellipse cx="0" cy="-38" rx="12" ry="40" fill="url(#petal-orange)" transform="rotate(60)" opacity="0.95"/>
          <ellipse cx="0" cy="-38" rx="12" ry="40" fill="url(#petal-orange)" transform="rotate(120)" opacity="0.9"/>
          <ellipse cx="0" cy="-38" rx="12" ry="40" fill="url(#petal-orange)" transform="rotate(180)" opacity="0.8"/>
          <ellipse cx="0" cy="-38" rx="12" ry="40" fill="url(#petal-orange)" transform="rotate(240)" opacity="0.8"/>
          <ellipse cx="0" cy="-38" rx="12" ry="40" fill="url(#petal-orange)" transform="rotate(300)" opacity="0.8"/>
          <circle cx="0" cy="0" r="16" fill="url(#stamen-glow)" opacity="0.5" style="animation: petal-shimmer 2.5s ease-in-out infinite 0.5s;"/>
          <circle cx="0" cy="0" r="6" fill="#ffe080" opacity="0.85" filter="url(#glow-strong)"/>
          <line x1="0" y1="0" x2="0" y2="-14" stroke="#b06828" stroke-width="1.5"/>
          <line x1="0" y1="0" x2="12" y2="-7" stroke="#b06828" stroke-width="1.5"/>
          <line x1="0" y1="0" x2="12" y2="7" stroke="#b06828" stroke-width="1.5"/>
          <line x1="0" y1="0" x2="0" y2="14" stroke="#b06828" stroke-width="1.5"/>
          <line x1="0" y1="0" x2="-12" y2="7" stroke="#b06828" stroke-width="1.5"/>
          <line x1="0" y1="0" x2="-12" y2="-7" stroke="#b06828" stroke-width="1.5"/>
          <circle cx="0" cy="-14" r="2.5" fill="#e8a050" filter="url(#glow-soft)"/>
          <circle cx="12" cy="-7" r="2.5" fill="#e8a050" filter="url(#glow-soft)"/>
          <circle cx="12" cy="7" r="2.5" fill="#e8a050" filter="url(#glow-soft)"/>
          <circle cx="0" cy="14" r="2.5" fill="#e8a050" filter="url(#glow-soft)"/>
          <circle cx="-12" cy="7" r="2.5" fill="#e8a050" filter="url(#glow-soft)"/>
          <circle cx="-12" cy="-7" r="2.5" fill="#e8a050" filter="url(#glow-soft)"/>
        </g>
      </g>

      <!-- ====== LILY 3 — RIGHT (cream/warm) ====== -->
      <g class="lily-group" style="transform-origin: 230px 308px">
        <g transform="translate(230,298) rotate(12)" filter="url(#glow-soft)">
          <ellipse cx="0" cy="-38" rx="12" ry="40" fill="url(#petal-warm)" transform="rotate(0)" opa
